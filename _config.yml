# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Jonguk Cheong
#description: >- # this means to ignore newlines until "baseurl:"
#  Undergraduate student 
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://jongukc.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username: jongukc
author:
  name: "Jonguk Cheong"
  email: jdal3031@snu.ac.kr 
locale: ko_KR

# Build settings
markdown: kramdown
#theme: minima
remote_theme: jekyll/minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

include:
  - _headers

toggle_dark_mode: true

links:
  github: "https://github.com/jongukc"
  lab: "https://compsec.snu.ac.kr"
  blee: "https://lifeasageek.github.io"

# Theme-specific settings

# If you want to link only specific pages in your header, use this and add the path to the pages
# in order as they should show up.
header_pages:
  #- _headers/pubs.html
  - _headers/posts.html

# Set to `true` to show excerpts on the homepage.
#show_excerpts: false

collections:
  posts:
    output: true
    permalink: /:collection/:title/

# Minima specific settings, which are only available from Minima 3.0 onward.
minima:
  # Minima skin selection.
  # Available skins are:
  # classic	           Default, light color scheme.
  # dark	             Dark variant of the classic skin.
  # auto	             Adaptive skin based on the default classic and dark skins.
  # solarized-light	   Light variant of solarized color scheme.
  # solarized-dark	   Dark variant of solarized color scheme.
  # solarized	         Adaptive skin for solarized color scheme skins.
  skin: custom
  
  # Minima date format.
  # The default value is "%b %d, %Y" (e.g. Nov 14, 2023) 
  # Refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this.
  #date_format: "%b-%d-%Y"

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - .github/
  - Dockerfile
  - README.md
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - script/
  - assets/profile.png
  - assets/minima-social-icons.liquid
  - assets/favicon/favicon.zip
