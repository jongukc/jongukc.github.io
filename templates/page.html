<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$en$endif$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply the saved theme before first paint so the page does not flash.
    (function () {
      var t = localStorage.getItem('darkmode');
      if (t) document.documentElement.setAttribute('color-theme', t);
    })();
  </script>
  <title>$if(pagetitle)$$site-title$ - $pagetitle$$else$$site-title$$endif$</title>
$if(description)$
  <meta name="description" content="$description$">
  <meta property="og:description" content="$description$">
$endif$
  <meta property="og:title" content="$if(pagetitle)$$pagetitle$$else$$site-title$$endif$">
  <meta property="og:type" content="$if(date)$article$else$website$endif$">
  <meta property="og:url" content="$site-url$$url$">
  <meta property="og:site_name" content="$site-title$">
  <link rel="canonical" href="$site-url$$url$">
  <link rel="alternate" type="application/atom+xml" title="$site-title$" href="/feed.xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/files/favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/files/favicon/favicon.svg">
  <link rel="shortcut icon" href="/files/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/files/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/files/favicon/site.webmanifest">
$if(math)$
  $math$
$endif$
</head>

<body>
  <header class="site-header">
    <div class="wrapper">
      <div class="site-title-wrapper">
        <a class="site-title" rel="author" href="/">$site-title$</a>
      </div>
      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" class="nav-trigger">
        <label for="nav-trigger">
          <span class="menu-icon">
            <svg viewBox="0 0 18 15" width="18px" height="15px">
              <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z" />
            </svg>
          </span>
        </label>
        <div class="trigger">
          <a class="page-link" href="/">Home</a>
          <a class="page-link" href="/posts/">Posts</a>
          <input id="toggle_dark_mode" class="toggle" type="checkbox">
          <label for="toggle_dark_mode" class="material-symbols-outlined toggle_btn"></label>
        </div>
      </nav>
    </div>
  </header>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
$if(date)$
      <article class="post">
        <header class="post-header">
          <h1 class="post-title">$title$</h1>
          <p class="post-meta">
            <time datetime="$date$">$date$</time>$if(author)$ • $for(author)$$author$$sep$, $endfor$$endif$
          </p>
        </header>
        <div class="post-content">
$body$
        </div>
      </article>
$else$
      <div class="post-content">
$body$
      </div>
$endif$
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">Last updated on $updated$.</div>
  </footer>

  <script src="/files/js/darkMode.js"></script>
</body>
</html>
